<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Money Pay</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Sora,system-ui,sans-serif;background:#070b14;color:#e8eefc;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body:before{background:#10b981;top:-30vmax;left:-20vmax}body:after{background:#f5b301;bottom:-35vmax;right:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}@keyframes shine{to{background-position:200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.g{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);border-radius:22px;padding:18px;animation:pop .5s both}
input,select{width:100%;padding:13px 14px;margin:6px 0;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:#fff;font:inherit;outline:0;transition:.2s}input:focus,select:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}
button{font:600 15px Sora,sans-serif;border:0;border-radius:14px;padding:13px 18px;color:#04110c;cursor:pointer;background:linear-gradient(110deg,#10b981,#6ee7b7,#10b981);background-size:200% 100%;transition:.25s}button:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,.35);animation:shine 1.4s linear infinite}button:active{transform:scale(.97)}button:disabled{opacity:.45;pointer-events:none}
.gold{background:linear-gradient(110deg,#f5b301,#ffe08a,#f5b301);background-size:200% 100%}.ghost{background:rgba(255,255,255,.08);color:#e8eefc}.bad{background:#ef4444;color:#fff}
.mut{color:#8fa0c4;font-size:13px}.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#243049}.ok{background:#064e3b;color:#6ee7b7}.wr{background:#4a3500;color:#ffd266}.no{background:#4c1111;color:#fca5a5}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111a2e;border:1px solid #10b981;padding:11px 20px;border-radius:99px;z-index:99;animation:pop .3s}
#app{max-width:480px;margin:0 auto;padding:18px 16px 110px}h1{font:800 30px Sora;letter-spacing:-1px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bal{font:800 32px Sora;background:linear-gradient(110deg,#fff,#6ee7b7,#ffe08a,#fff);background-size:200% 100%;-webkit-background-clip:text;color:transparent;animation:shine 5s linear infinite}
.hero{text-align:center;padding:30px 18px;margin:14px 0}.hero .coin{font-size:54px;display:inline-block;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;animation:rise .5s both}
nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:7px;background:rgba(14,20,36,.85);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:99px;z-index:50}nav button{background:0;color:#8fa0c4;padding:10px 20px;border-radius:99px;animation:none;box-shadow:none}nav button.on{background:#10b981;color:#04110c}
.load{display:grid;place-items:center;padding:70px 0}.load i{width:46px;height:46px;border:4px solid #1f2b45;border-top-color:#10b981;border-radius:50%;animation:spin .8s linear infinite}
.num{background:rgba(0,0,0,.4);padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin:8px 0;font:600 17px Sora}.num button{padding:7px 12px;font-size:13px}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:99;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div id="app"></div><script>setTimeout(function(){if(!window.__ok){document.getElementById("app").innerHTML='<div style="max-width:380px;margin:90px auto;padding:22px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:center;line-height:1.6"><b style="font-size:18px">Money Pay could not start</b><p style="color:#8fa0c4;margin-top:8px">Firebase did not load. Open this page from your hosted website (not from a file preview) and check your internet connection.</p></div>'}},4000)</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {getFirestore,doc,setDoc,updateDoc,addDoc,collection,onSnapshot,query,where,writeBatch,serverTimestamp,increment,deleteDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAZhb4PcixHdyxtPckrEGWsYaTVG_uaYuI",authDomain:"srabon-f1dea.firebaseapp.com",projectId:"srabon-f1dea",storageBucket:"srabon-f1dea.firebasestorage.app",messagingSenderId:"346888955991",appId:"1:346888955991:web:b33c8155179e40a32e1b12",measurementId:"G-11XX120Z00"});const auth=getAuth(app),db=getFirestore(app);window.__ok=1;
const $=s=>document.querySelector(s),A=$('#app');A.innerHTML='<div class="load"><i></i></div>';const M=p=>p+"@earnbox.app";
let S={},U=null,uid=null,tasks=[],claims={},fees=[],wds={},tab='home',mode='in',view='main',busy=false,subs=[];
const toast=t=>{const e=document.createElement('div');e.id='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)};
const boom=()=>{for(let i=0;i<40;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360} 90% 60%);animation-delay:${Math.random()*.4}s`;document.body.append(c);setTimeout(()=>c.remove(),2400)}};
const tk=n=>'৳'+Number(n||0).toLocaleString();
onSnapshot(doc(db,'settings','config'),s=>{S=s.data()||{};draw()});
onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];uid=u?.uid||null;if(!u){U=null;draw();return}
 subs=[onSnapshot(doc(db,'users',uid),s=>{U=s.data()||null;draw()}),
 onSnapshot(query(collection(db,'tasks')),s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));draw()}),
 onSnapshot(collection(db,'users',uid,'claims'),s=>{claims={};s.docs.forEach(d=>claims[d.id]=1);draw()}),
 onSnapshot(query(collection(db,'feePayments'),where('uid','==',uid)),s=>{fees=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));draw()}),
 onSnapshot(query(collection(db,'withdrawals'),where('uid','==',uid)),s=>{wds={};s.docs.forEach(d=>wds[d.id]={id:d.id,...d.data()});draw()})]});
window.sw=m=>{mode=m;draw()};window.go=t=>{tab=t;view='main';draw()};
window.auth_=async()=>{const p=$('#ph').value.trim(),w=$('#pw').value,n=$('#nm')?.value.trim();if(!/^01\d{9}$/.test(p))return toast('Enter a valid 11-digit number');if(w.length<6)return toast('Password needs 6+ characters');
 try{if(mode==='up'){if(!n)return toast('Enter your name');const c=await createUserWithEmailAndPassword(auth,M(p),w);await setDoc(doc(db,'users',c.user.uid),{name:n,phone:p,bonusBal:0,taskBal:0,bonusClaimed:false,createdAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,M(p),w)}catch(e){toast(e.code==='auth/email-already-in-use'?'Number already registered':'Check your number and password')}};
window.out=()=>signOut(auth);
window.claimBonus=async b=>{if(busy)return;busy=true;try{await updateDoc(doc(db,'users',uid),{bonusClaimed:true,bonusBal:increment(S.regBonus||0)});boom();toast('Bonus claimed '+tk(S.regBonus))}catch(e){toast('Could not claim')}busy=false};
window.claimTask=async id=>{if(busy||claims[id])return;const t=tasks.find(x=>x.id===id);busy=true;try{const b=writeBatch(db);b.set(doc(db,'users',uid,'claims',id),{reward:t.reward,at:serverTimestamp()});b.update(doc(db,'users',uid),{taskBal:increment(t.reward),lastClaim:id});await b.commit();boom();toast('+'+tk(t.reward))}catch(e){toast('Could not claim')}busy=false};
window.openFee=w=>{view='load';draw();setTimeout(()=>{view='fee:'+w;draw()},1100)};
window.copy=n=>{navigator.clipboard?.writeText(n);toast('Number copied')};
window.sendFee=async w=>{const t=$('#trx').value.trim(),m=$('#mth').value;if(t.length<4)return toast('Enter the Transaction ID');
 try{await addDoc(collection(db,'feePayments'),{uid,wallet:w,fee:w==='bonus'?S.feeBonus||0:S.feeTask||0,method:m,trxId:t,status:'pending',createdAt:serverTimestamp()});toast('Submitted for approval');tab='wd';view='main';draw()}catch(e){toast('Failed. Refresh and retry')}};
window.doWd=async(w,fid)=>{const n=$('#rn')?.value.trim(),m=$('#rm')?.value;if(!/^01\d{9}$/.test(n))return toast('Enter your receiving number');const amt=w==='bonus'?U.bonusBal:U.taskBal;
 try{const b=writeBatch(db);b.set(doc(db,'withdrawals',fid),{uid,wallet:w,amount:amt,method:m,number:n,status:'pending',createdAt:serverTimestamp()});b.update(doc(db,'users',uid),w==='bonus'?{bonusBal:0,lastWd:fid}:{taskBal:0,lastWd:fid});await b.commit();boom();toast('Withdrawal requested')}catch(e){toast('Failed. Try again')}};
const chip=s=>`<span class="chip ${s==='approved'?'ok':s==='rejected'?'no':'wr'}">${s}</span>`;
function walletCard(w,name,bal,min,fee){const f=fees.find(x=>x.wallet===w&&!wds[x.id]);let a;
 if(f?.status==='approved'){a=`<div class="mut" style="margin:10px 0">Fee approved. You can withdraw your full ${name.toLowerCase()} balance.</div><select id="rm"><option>bKash</option><option>Nagad</option></select><input id="rn" inputmode="numeric" placeholder="Your receiving number"><button class="gold" style="width:100%" onclick="doWd('${w}','${f.id}')">Withdraw ${tk(bal)}</button>`}
 else if(f?.status==='pending')a=`<div class="mut" style="margin:10px 0">${chip('pending')} Fee under review. We will approve it shortly.</div>`;
 else a=`<div class="mut" style="margin:10px 0">${f?chip('rejected')+' Last payment was rejected. ':''}Minimum to withdraw: ${tk(min)}</div><button style="width:100%" ${bal>0&&bal>=min?'':'disabled'} onclick="openFee('${w}')">Process withdrawal</button>`;
 return `<div class="g" style="margin-top:12px"><div class="row"><b>${name}</b><span class="bal" style="font-size:24px">${tk(bal)}</span></div>${a}</div>`}
function draw(){if(!uid){A.innerHTML=`<div style="padding:60px 0 20px;text-align:center"><div class="hero coin" style="font-size:60px;animation:float 3s infinite">🪙</div><h1>Money Pay</h1><p class="mut">Claim your bonus. Complete tasks. Withdraw.</p></div><div class="g"><div class="row" style="margin-bottom:10px"><button class="${mode==='in'?'':'ghost'}" style="flex:1" onclick="sw('in')">Log in</button><button class="${mode==='up'?'':'ghost'}" style="flex:1" onclick="sw('up')">Sign up</button></div>${mode==='up'?'<input id="nm" placeholder="Full name">':''}<input id="ph" inputmode="numeric" maxlength="11" placeholder="Phone number (01XXXXXXXXX)"><input id="pw" type="password" placeholder="Password"><button style="width:100%;margin-top:8px" onclick="auth_()">${mode==='up'?'Create account':'Log in'}</button></div>`;return}
 if(!U){A.innerHTML='<div class="load"><i></i></div>';clearTimeout(window.__pt);window.__pt=setTimeout(()=>{if(uid&&!U)A.innerHTML='<div class="g" style="margin-top:80px;text-align:center"><b>Account not found</b><p class="mut" style="margin:8px 0 14px">No profile exists for this number. Log out and sign up first.</p><button onclick="out()">Log out</button></div>'},4000);return}
 if(view==='load'){A.innerHTML='<div class="load"><i></i><p class="mut" style="margin-top:16px">Preparing your payment page…</p></div>';return}
 if(view.startsWith('fee:')){const w=view.slice(4),fee=w==='bonus'?S.feeBonus:S.feeTask;A.innerHTML=`<button class="ghost" onclick="go('wd')">← Back</button><div class="g" style="margin-top:14px"><h1 style="font-size:24px">Pay the withdraw fee</h1><p class="mut">Send exactly <b style="color:#ffe08a">${tk(fee)}</b> by Send Money, then enter the Transaction ID.</p>${S.bkash?`<div class="num"><span>bKash ${S.bkash}</span><button onclick="copy('${S.bkash}')">Copy</button></div>`:''}${S.nagad?`<div class="num"><span>Nagad ${S.nagad}</span><button onclick="copy('${S.nagad}')">Copy</button></div>`:''}<select id="mth"><option>bKash</option><option>Nagad</option></select><input id="trx" placeholder="Transaction ID"><button class="gold" style="width:100%;margin-top:8px" onclick="sendFee('${w}')">Submit payment</button></div>`;return}
 const done=U.bonusClaimed;let h=`<div class="row"><div><p class="mut">Welcome back</p><b style="font-size:19px">${U.name}</b></div><button class="ghost" onclick="out()">Log out</button></div>`;
 if(tab==='home'){h+=`<div class="g hero"><div class="coin">🎁</div><p class="mut">Total balance</p><div class="bal">${tk((U.bonusBal||0)+(U.taskBal||0))}</div></div>`;
  if(!done)h+=`<div class="g" style="text-align:center"><b style="font-size:18px">Registration bonus</b><p class="mut" style="margin:6px 0 14px">Your welcome reward is ready.</p><button class="gold" style="width:100%" onclick="claimBonus()">Claim ${tk(S.regBonus)}</button></div>`;
  else{h+=`<h3 style="margin:18px 0 4px">Tasks</h3>`;if(!tasks.length)h+='<p class="mut">New tasks are coming soon.</p>';tasks.forEach((t,i)=>h+=`<div class="g task" style="animation-delay:${i*.07}s"><div><b>${t.name}</b><div class="mut">Reward ${tk(t.reward)}</div></div>${claims[t.id]?'<span class="chip ok">Claimed</span>':`<button onclick="claimTask('${t.id}')">Claim</button>`}</div>`)}}
 else{h+=`<h2 style="margin:16px 0 0">Withdraw</h2>`+walletCard('bonus','Bonus wallet',U.bonusBal||0,S.minBonus||0,S.feeBonus)+walletCard('task','Task wallet',U.taskBal||0,S.minTask||0,S.feeTask);
  const l=Object.values(wds);if(l.length){h+='<h3 style="margin:20px 0 4px">History</h3>';l.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).forEach(x=>h+=`<div class="g task"><div><b>${tk(x.amount)}</b><div class="mut">${x.method} ${x.number}</div></div>${chip(x.status)}</div>`)}}
 A.innerHTML=h+`<nav><button class="${tab==='home'?'on':''}" onclick="go('home')">Home</button><button class="${tab==='wd'?'on':''}" onclick="go('wd')">Withdraw</button></nav>`}
</script></body></html>
