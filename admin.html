<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Pay Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Sora,system-ui,sans-serif;background:#070b14;color:#e8eefc;min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;animation:drift 18s ease-in-out infinite alternate}
body:before{background:#10b981;top:-30vmax;left:-20vmax}body:after{background:#f5b301;bottom:-35vmax;right:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:none;opacity:1}}@keyframes shine{to{background-position:200% 0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.g{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);border-radius:22px;padding:18px;animation:pop .5s both}
input,select{width:100%;padding:13px 14px;margin:6px 0;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:#fff;font:inherit;outline:0;transition:.2s}input:focus,select:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}
button{font:600 15px Sora,sans-serif;border:0;border-radius:14px;padding:13px 18px;color:#04110c;cursor:pointer;background:linear-gradient(110deg,#10b981,#6ee7b7,#10b981);background-size:200% 100%;transition:.25s}button:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,185,129,.35);animation:shine 1.4s linear infinite}button:active{transform:scale(.97)}button:disabled{opacity:.45;pointer-events:none}
.gold{background:linear-gradient(110deg,#f5b301,#ffe08a,#f5b301);background-size:200% 100%}.ghost{background:rgba(255,255,255,.08);color:#e8eefc}.bad{background:#ef4444;color:#fff}
.mut{color:#8fa0c4;font-size:13px}.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#243049}.ok{background:#064e3b;color:#6ee7b7}.wr{background:#4a3500;color:#ffd266}.no{background:#4c1111;color:#fca5a5}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111a2e;border:1px solid #10b981;padding:11px 20px;border-radius:99px;z-index:99;animation:pop .3s}
#app{max-width:880px;margin:0 auto;padding:18px 16px 60px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tabs button{background:rgba(255,255,255,.07);color:#cfd9f3;white-space:nowrap;animation:none}.tabs button.on{background:#10b981;color:#04110c}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;animation:rise .4s both}.item div button{padding:8px 14px;margin-left:6px;font-size:13px}label{display:block;margin-top:10px;font-size:13px;color:#8fa0c4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><div id="app"></div><script>setTimeout(function(){if(!window.__ok){document.getElementById("app").innerHTML='<div style="max-width:380px;margin:90px auto;padding:22px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:center;line-height:1.6"><b style="font-size:18px">Money Pay could not start</b><p style="color:#8fa0c4;margin-top:8px">Firebase did not load. Open this page from your hosted website (not from a file preview) and check your internet connection.</p></div>'}},4000)</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import {getFirestore,doc,setDoc,updateDoc,addDoc,collection,onSnapshot,query,where,writeBatch,serverTimestamp,increment,deleteDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAZhb4PcixHdyxtPckrEGWsYaTVG_uaYuI",authDomain:"srabon-f1dea.firebaseapp.com",projectId:"srabon-f1dea",storageBucket:"srabon-f1dea.firebasestorage.app",messagingSenderId:"346888955991",appId:"1:346888955991:web:b33c8155179e40a32e1b12",measurementId:"G-11XX120Z00"});const auth=getAuth(app),db=getFirestore(app);window.__ok=1;const ADMIN="hemelbala84@gmail.com";
const $=s=>document.querySelector(s),A=$('#app');let S={},tasks=[],fees=[],wds=[],users={},tab='set',fl='pending',subs=[],ok=false;
const toast=t=>{const e=document.createElement('div');e.id='toast';e.style.bottom='30px';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)};
const tk=n=>'৳'+Number(n||0).toLocaleString(),ls=(c,set)=>onSnapshot(collection(db,c),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));draw()});
onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];ok=u?.email===ADMIN;if(!ok){draw();return}
 subs=[onSnapshot(doc(db,'settings','config'),s=>{S=s.data()||{};if(tab==='set')draw()}),ls('tasks',x=>tasks=x),ls('feePayments',x=>fees=x),ls('withdrawals',x=>wds=x),
 onSnapshot(collection(db,'users'),s=>{users={};s.docs.forEach(d=>users[d.id]=d.data());draw()})]});
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(e){toast('Wrong email or password')}};
window.tb=t=>{tab=t;draw()};window.fl_=f=>{fl=f;draw()};
window.save=async()=>{const n=k=>Number($('#'+k).value)||0;try{await setDoc(doc(db,'settings','config'),{regBonus:n('regBonus'),minBonus:n('minBonus'),minTask:n('minTask'),feeBonus:n('feeBonus'),feeTask:n('feeTask'),bkash:$('#bkash').value.trim(),nagad:$('#nagad').value.trim()},{merge:true});toast('Settings saved')}catch(e){toast('Save failed')}};
window.addTask=async()=>{const n=$('#tn').value.trim(),r=Number($('#tr').value);if(!n||!(r>0))return toast('Enter a name and an amount');await addDoc(collection(db,'tasks'),{name:n,reward:r,createdAt:serverTimestamp()});$('#tn').value=$('#tr').value='';toast('Task added')};
window.delTask=id=>deleteDoc(doc(db,'tasks',id));
window.fee=(id,s)=>updateDoc(doc(db,'feePayments',id),{status:s}).then(()=>toast('Fee '+s));
window.wd=async(id,s)=>{const w=wds.find(x=>x.id===id);const b=writeBatch(db);b.update(doc(db,'withdrawals',id),{status:s});if(s==='rejected')b.update(doc(db,'users',w.uid),{[w.wallet==='bonus'?'bonusBal':'taskBal']:increment(w.amount)});await b.commit();toast('Withdrawal '+s)};
const chip=s=>`<span class="chip ${s==='approved'?'ok':s==='rejected'?'no':'wr'}">${s}</span>`,nm=u=>users[u]?`${users[u].name} · ${users[u].phone}`:u;
const acts=(f,id,s)=>s==='pending'?`<div><button onclick="${f}('${id}','approved')">Approve</button><button class="bad" onclick="${f}('${id}','rejected')">Reject</button></div>`:chip(s);
function list(arr,f){const r=arr.filter(x=>fl==='all'||x.status===fl);return `<div class="tabs">${['pending','approved','rejected','all'].map(s=>`<button class="${fl===s?'on':''}" onclick="fl_('${s}')">${s}</button>`).join('')}</div>`+(r.length?r.map(x=>f(x)).join(''):'<p class="mut">Nothing here.</p>')}
function draw(){if(!ok){A.innerHTML=`<div class="g" style="max-width:380px;margin:80px auto"><h2>Admin sign in</h2><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button style="width:100%;margin-top:8px" onclick="login()">Sign in</button></div>`;return}
 const pend=x=>x.filter(i=>i.status==='pending').length;let h=`<div class="row" style="display:flex;justify-content:space-between;align-items:center"><h1 style="font:800 26px Sora">Money Pay Admin</h1><button class="ghost" onclick="signOut(auth)">Log out</button></div><div class="tabs">${[['set','Settings'],['tasks','Tasks'],['fees','Fees ('+pend(fees)+')'],['wd','Withdrawals ('+pend(wds)+')']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tb('${k}')">${l}</button>`).join('')}</div>`;
 if(tab==='set')h+=`<div class="g"><div class="grid"><div><label>Registration bonus (৳)</label><input id="regBonus" type="number" value="${S.regBonus??''}"></div><div></div><div><label>Bonus wallet: minimum to withdraw (৳)</label><input id="minBonus" type="number" value="${S.minBonus??''}"></div><div><label>Task wallet: minimum to withdraw (৳)</label><input id="minTask" type="number" value="${S.minTask??''}"></div><div><label>Bonus wallet: withdraw fee (৳)</label><input id="feeBonus" type="number" value="${S.feeBonus??''}"></div><div><label>Task wallet: withdraw fee (৳)</label><input id="feeTask" type="number" value="${S.feeTask??''}"></div><div><label>bKash number</label><input id="bkash" value="${S.bkash??''}"></div><div><label>Nagad number</label><input id="nagad" value="${S.nagad??''}"></div></div><button style="margin-top:16px" onclick="save()">Save settings</button></div>`;
 if(tab==='tasks')h+=`<div class="g"><div class="grid"><input id="tn" placeholder="Task name"><input id="tr" type="number" placeholder="Reward (৳)"></div><button onclick="addTask()">Add task</button></div>`+tasks.map(t=>`<div class="g item"><div><b>${t.name}</b><div class="mut">${tk(t.reward)}</div></div><button class="bad" onclick="delTask('${t.id}')">Delete</button></div>`).join('');
 if(tab==='fees')h+=list(fees,x=>`<div class="g item"><div><b>${nm(x.uid)}</b><div class="mut">${x.wallet} wallet · ${tk(x.fee)} via ${x.method}<br>TrxID: <b style="color:#ffe08a">${x.trxId}</b></div></div>${acts('fee',x.id,x.status)}</div>`);
 if(tab==='wd')h+=list(wds,x=>`<div class="g item"><div><b>${nm(x.uid)}</b><div class="mut">${x.wallet} wallet · ${tk(x.amount)}<br>Send to ${x.method} <b style="color:#ffe08a">${x.number}</b></div></div>${acts('wd',x.id,x.status)}</div>`);
 A.innerHTML=h}
window.signOut=signOut;window.auth=auth;draw();
</script></body></html>
